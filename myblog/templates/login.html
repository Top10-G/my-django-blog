{% extends "base_layout.html" %}

{% block page_title %}Login | Château Gourmand{% endblock %}

{% block page_content %}
<section class="auth-container">
  <div class="auth-card">
    <h2 class="auth-title">Welcome Back</h2>
    <p class="auth-subtitle">Sign in to continue your taste journey.</p>

    <form method="POST" action="">
      {% csrf_token %}

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ form.username.value|default:'' }}" placeholder="Enter your username">
        {{ form.username.errors }}
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password">
        {{ form.password.errors }}
      </div>

      <button type="submit" class="btn primary w-100"  style="justify-content: center;">Login</button>
    </form>

    <p class="auth-switch">
      Not a member yet?
      <a href="{% url 'signup' %}" class="link-accent">Create an account</a>
    </p>
  </div>
</section>
{% endblock %}
