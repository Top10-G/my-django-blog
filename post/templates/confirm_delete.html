{% extends 'base_layout.html' %}
{% block page_content %}
  <h2>Delete Comment</h2>
  <p>Are you sure you want to delete this comment?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'single_post' comment.post.id %}">Cancel</a>
  </form>
{% endblock %}
